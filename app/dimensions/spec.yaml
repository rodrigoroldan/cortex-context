# app/dimensions/spec.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Pilar Intent — Especificações do Produto
#
# Representa o "Por Quê" do sistema. Qualquer documento que captura
# intenção de produto: specs, requisitos, épicos, user stories, RFCs.
#
# Spec = PASTA (group_by: numbered_folder): todos os .md dentro de uma pasta
# numerada ("NNN-slug", 3+ dígitos) contribuem para UM nó (:Spec:Intent):
#   id     → spec-{NNN} (ou frontmatter.id do arquivo primário)
#   title  → frontmatter.title ou # H1 do arquivo primário
#   status → frontmatter.status ou inferido do corpo do arquivo primário
#   labels → inferidos do slug + frontmatter.labels
#   files / files_str / source_folder / has_folder → descrevem a pasta
# O arquivo primário é spec.md > README.md > plan.md (raiz da pasta) > o
# primeiro em ordem alfabética. Arquivos fora de pasta numerada são ignorados.
# Cada .md gera DocumentChunk (spec-NNN__<arquivo>__chunk_<i>) indexados no
# fulltext doc_chunk_fts — é o que permite achar texto do corpo por keyword.
#
# Specs também podem vir de issues do GitHub (cortex.config.yaml → spec_issues);
# elas enriquecem o mesmo nó com issue_* — ver docs/DIMENSION-SCHEMA.md.
# ─────────────────────────────────────────────────────────────────────────────

dimension: spec
node_label: Spec
pillar: Intent
parser: builtin.markdown_frontmatter
source_type: filesystem
source_path: "/specs"
group_by: numbered_folder
source_patterns:
  - "**/*.md"

fields:
  - name: id
    type: string
    required: true
    description: "Identificador único da spec (ex: spec-042)"
  - name: title
    type: string
    required: true
    description: "Título legível da spec"
  - name: status
    type: string
    description: "Status: planned | in-progress | done | deprecated"
  - name: summary
    type: string
    description: "Resumo de uma linha da spec"
  - name: labels
    type: list[string]
    description: "Tags semânticas inferidas do slug e do frontmatter"
  - name: files
    type: list[string]
    description: "Arquivos .md da pasta da spec, relativos a ela (ex: RUNBOOK.md, contracts/api.md)"
  - name: source_folder
    type: string
    description: "Nome da pasta da spec (ex: 861-split-bill)"
  - name: has_folder
    type: boolean
    description: "true quando o nó tem pasta no filesystem (a pasta manda em title/summary/status)"
  - name: has_issue
    type: boolean
    description: "true quando o nó tem issue do GitHub (issue_number, issue_url, issue_state, issue_state_reason, issue_updated_at)"

relationships:
  - type: DEPENDS_ON
    direction: outbound
    target_label: Spec
    description: "Esta spec depende de outra spec"
    built_by: parser
  - type: SUPERSEDES
    direction: outbound
    target_label: Spec
    description: "Esta spec substitui uma spec mais antiga"
    built_by: parser
  - type: EVOLVES_FROM
    direction: outbound
    target_label: Spec
    description: "Evolução de outra spec"
    built_by: parser
  - type: RELATED_TO
    direction: outbound
    target_label: Spec
    description: "Specs relacionadas"
    built_by: parser
  - type: AFFECTS
    direction: outbound
    target_label: Service
    description: "Esta spec afeta um serviço"
    built_by: relationship_builder

indexes:
  - type: constraint_unique
    property: id
    cypher: "CREATE CONSTRAINT spec_id IF NOT EXISTS FOR (n:Spec) REQUIRE n.id IS UNIQUE"
  - type: fulltext
    name: spec_fulltext
    properties: [title, summary, labels_str]
    cypher: "CREATE FULLTEXT INDEX spec_fulltext IF NOT EXISTS FOR (n:Spec) ON EACH [n.title, n.summary, n.labels_str]"
  - type: fulltext
    name: doc_chunk_fts
    properties: [content]
    cypher: "CREATE FULLTEXT INDEX doc_chunk_fts IF NOT EXISTS FOR (n:DocumentChunk) ON EACH [n.content]"
  - type: index
    name: documentchunk_parent_id_idx
    property: parent_id
    cypher: "CREATE INDEX documentchunk_parent_id_idx IF NOT EXISTS FOR (n:DocumentChunk) ON (n.parent_id)"
